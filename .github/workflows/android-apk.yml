name: Build ZX STORE 24H Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Debug Keystore
        run: |
          echo "=== MEMPERSIAPKAN DEBUG KEYSTORE ==="
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Memulihkan debug.keystore dari debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          
          if [ ! -s debug.keystore ]; then
            echo "debug.keystore tidak ditemukan / kosong. Membuat debug keystore standar via keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          echo "Verifikasi status keystore:"
          ls -lh debug.keystore

      - name: Build Android Debug APK
        id: gradle_build
        run: |
          echo "============================================="
          echo "MEMULAI BUILD ANDROID DEBUG APK (ZX STORE 24H)"
          echo "============================================="
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log
        continue-on-error: false

      - name: Diagnostic on Build Failure
        if: failure()
        run: |
          echo "::error title=Gradle Build Failed::Build Android Debug APK gagal! Menampilkan ringkasan error utama:"
          echo "=========================================================="
          echo "=== RINGKASAN DIAGNOSTIK ERROR GRADLE BUILD TERBARU ==="
          echo "=========================================================="
          if [ -f gradle-build.log ]; then
            grep -E -A 10 -B 2 "FAILURE:|What went wrong|Caused by|Execution failed for task" gradle-build.log | head -n 60 || tail -n 60 gradle-build.log
          else
            echo "File gradle-build.log tidak ditemukan."
          fi
          echo "=========================================================="

      - name: Verify APK Output
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error title=APK Not Found::File APK tidak ditemukan di $APK_FILE"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
          if [ "$FILE_SIZE" -le 0 ]; then
            echo "::error title=Empty APK::File APK berukuran 0 byte (kosong)!"
            exit 1
          fi
          
          mkdir -p artifacts
          cp "$APK_FILE" artifacts/ZX-STORE-24H-debug.apk
          
          echo "============================================="
          echo "APK BUILD BERHASIL DAN TERVERIFIKASI!"
          echo "File: artifacts/ZX-STORE-24H-debug.apk"
          echo "Ukuran: $FILE_SIZE bytes"
          ls -lh artifacts/ZX-STORE-24H-debug.apk
          echo "============================================="

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZX-STORE-24H-APK
          path: artifacts/ZX-STORE-24H-debug.apk
          retention-days: 30
          if-no-files-found: error
