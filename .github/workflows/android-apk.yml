name: Build ZX STORE 24H Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
            echo "Keystore check completed."
          fi

      - name: Build Android Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK Output
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::File APK tidak ditemukan di $APK_FILE"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
          if [ "$FILE_SIZE" -le 0 ]; then
            echo "::error::File APK berukuran 0 byte (kosong)!"
            exit 1
          fi
          
          mkdir -p artifacts
          cp "$APK_FILE" artifacts/ZX-STORE-24H-debug.apk
          
          echo "============================================="
          echo "APK BUILD BERHASIL!"
          echo "File: artifacts/ZX-STORE-24H-debug.apk"
          echo "Ukuran: $FILE_SIZE bytes"
          ls -lh artifacts/ZX-STORE-24H-debug.apk
          echo "============================================="

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZX-STORE-24H-APK
          path: artifacts/ZX-STORE-24H-debug.apk
          retention-days: 30
