name: Build ZX STORE 24H Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag version (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify and Prepare APK File
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK output not found at $APK_PATH"
            exit 1
          fi
          
          # Create formatted branded release artifact
          mkdir -p release-output
          cp "$APK_PATH" release-output/ZX-STORE-24H-debug.apk
          
          echo "============================================="
          echo "SUCCESS: APK successfully generated!"
          echo "Output location: release-output/ZX-STORE-24H-debug.apk"
          ls -lh release-output/ZX-STORE-24H-debug.apk
          echo "============================================="

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZX-STORE-24H-debug-apk
          path: release-output/ZX-STORE-24H-debug.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: "ZX STORE 24H — Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}"
          body: |
            ### 🛒 ZX STORE 24H — ZUCCHERO XANN (Android APK)
            
            Versi terbaru aplikasi toko online 24 jam nonstop dengan pembayaran QRIS otomatis dan backend Cloud Firestore.
            
            #### 📱 Fitur Rilis:
            - **Desain Premium Dark**: Hitam, Cyan Elektrik, Abu-abu gelap.
            - **Pembayaran QRIS Resmi**: ZUCCHERO XANN (NMID: ID1026503273710).
            - **Katalog Produk 24 Jam**: Top Up Game instan, Voucher Digital, dan Merchandise Resmi.
            - **Verifikasi Pembayaran & Dashboard Owner**: Kelola pesanan, ubah status, dan kelola stok realtime.
            
            #### 📥 Cara Install APK:
            1. Unduh berkas `ZX-STORE-24H-debug.apk` di bawah ini.
            2. Buka berkas APK pada perangkat Android Anda.
            3. Jika muncul peringatan izin, pilih "Izinkan pemasangan dari sumber ini".
            4. Buka aplikasi **ZX STORE 24H** dan nikmati kemudahan bertransaksi!
          draft: false
          prerelease: false
          files: release-output/ZX-STORE-24H-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
