name: Publish ZX STORE 24H GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Versi Release (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Debug Keystore
        run: |
          echo "=== MEMPERSIAPKAN DEBUG KEYSTORE UNTUK RELEASE BUILD ==="
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Memulihkan debug.keystore dari debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          
          if [ ! -s debug.keystore ]; then
            echo "debug.keystore tidak ditemukan / kosong. Membuat debug keystore standar via keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          echo "Verifikasi status keystore:"
          ls -lh debug.keystore

      - name: Build Android APK
        id: gradle_build
        run: |
          echo "============================================="
          echo "MEMULAI BUILD ANDROID RELEASE APK (ZX STORE 24H)"
          echo "============================================="
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log
        continue-on-error: false

      - name: Diagnostic on Build Failure
        if: failure()
        run: |
          echo "::error title=Gradle Build Failed::Build Android Release APK gagal! Menampilkan ringkasan error:"
          echo "=========================================================="
          if [ -f gradle-build.log ]; then
            grep -E -A 10 -B 2 "FAILURE:|What went wrong|Caused by|Execution failed for task" gradle-build.log | head -n 60 || tail -n 60 gradle-build.log
          fi
          echo "=========================================================="

      - name: Determine Version Tag and Prepare APK
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::File APK tidak ditemukan di $APK_SOURCE"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$APK_SOURCE" 2>/dev/null || stat -f%z "$APK_SOURCE")
          if [ "$FILE_SIZE" -le 0 ]; then
            echo "::error::File APK kosong!"
            exit 1
          fi
          
          mkdir -p release-dist
          RELEASE_APK_NAME="ZX-STORE-24H-${TAG}.apk"
          cp "$APK_SOURCE" "release-dist/${RELEASE_APK_NAME}"
          
          echo "============================================="
          echo "RELEASE APK READY: release-dist/${RELEASE_APK_NAME}"
          echo "Ukuran File: $FILE_SIZE bytes"
          ls -lh "release-dist/${RELEASE_APK_NAME}"
          echo "============================================="
          
          echo "apk_name=${RELEASE_APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Release Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: ZX-STORE-24H-Release-APK
          path: release-dist/${{ steps.prep.outputs.apk_name }}
          retention-days: 60

      - name: Create GitHub Release and Upload APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "ZX STORE 24H — Release ${{ steps.prep.outputs.tag }}"
          body: |
            ## 🛒 ZX STORE 24H — ZUCCHERO XANN (Official Android Release)
            
            Versi rilis resmi **ZX STORE 24H** (Build: `${{ steps.prep.outputs.tag }}`).
            
            ---
            
            ### ✨ Fitur Utama:
            - **Tema Premium Dark**: Desain modern hitam dan cyan elektrik.
            - **Pembayaran QRIS Asli**: Merchant ZUCCHERO XANN (NMID: ID1026503273710) terintegrasi langsung di aplikasi.
            - **Katalog Produk 24 Jam Nonstop**: Top Up Game, Voucher Digital, dan Official Merchandise.
            - **Autentikasi Aman**: Google Sign-In via Credential Manager.
            - **Database Cloud Realtime**: Cloud Firestore dengan Zero-Trust Security Rules.
            - **Dashboard Owner & Verifikasi Transaksi**: Pemantauan pesanan dan verifikasi pembayaran manual.
            
            ---
            
            ### 📲 Petunjuk Instalasi APK:
            1. Unduh berkas **`${{ steps.prep.outputs.apk_name }}`** di bagian Assets di bawah.
            2. Buka file APK di perangkat Android Anda.
            3. Aktifkan opsi *"Izinkan pemasangan dari sumber tidak dikenal / browser"* jika diminta.
            4. Selesaikan instalasi dan buka aplikasi **ZX STORE 24H**.
          draft: false
          prerelease: false
          files: release-dist/${{ steps.prep.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
